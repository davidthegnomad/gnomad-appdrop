[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appdrop"
version = "1.1.0"
description = "Gnomad AppDrop — Mac-style drag-and-drop app installer for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gnomad Studio" }]
# Zero runtime deps — stdlib only. GTK GUI optional via distro packages.
dependencies = []

[project.scripts]
appdrop = "appdrop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appdrop = ["assets/*"]
